<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#130F1D">
  <title>{% block title %}CNAB Studio | Conversor de arquivos{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #130F1D;
      --panel: #21192F;
      --panel-soft: #2B203D;
      --text: #F5F0FF;
      --muted: #AFA3C5;
      --line: rgba(196, 181, 253, .13);
      --accent: #A78BFA;
      --accent-strong: #8B5CF6;
      --green: #C4B5FD;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 75% -12%, rgba(109, 40, 217, .23), transparent 53%),
                  radial-gradient(ellipse at 4% 95%, rgba(139, 92, 246, .12), transparent 45%),
                  var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 28px 28px 36px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding-bottom: 24px; border-bottom: 1px solid var(--line);
    }
    .brand { display: inline-flex; align-items: center; gap: 13px; }
    .brand-icon {
      width: 46px; height: 46px; display: grid; place-items: center;
      font-weight: 850; font-size: 21px; letter-spacing: -.08em; border-radius: 14px;
      color: #F5F0FF; border: 1px solid rgba(196, 181, 253, .36);
      background: linear-gradient(145deg, #7C3AED, #4C1D95);
      box-shadow: 0 8px 25px rgba(109, 40, 217, .22);
    }
    .brand-name { display: block; font-size: 18px; font-weight: 750; letter-spacing: -.03em; }
    .brand-caption { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .topbar-right { display: flex; align-items: center; gap: 20px; }
    .status { color: #C9BEDD; display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .status-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(196, 181, 253, .13); }
    .nav { display: flex; gap: 6px; background: rgba(30, 22, 44, .78); border: 1px solid var(--line); padding: 5px; border-radius: 12px; }
    .nav a { padding: 9px 14px; color: #B8AACC; font-size: 13px; border-radius: 8px; transition: .18s; }
    .nav a:hover, .nav a:focus-visible { color: white; background: rgba(167, 139, 250, .14); }
    .nav a[aria-current="page"] { color: #F3EAFF; background: rgba(167, 139, 250, .18); }
    .main { padding-top: 47px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 16px; height: 1px; background: var(--accent); }
    .page-title { margin: 13px 0 12px; font-size: clamp(30px, 4.3vw, 43px); font-weight: 760; letter-spacing: -.05em; line-height: 1.15; }
    .page-lead { color: var(--muted); line-height: 1.7; max-width: 640px; margin: 0; font-size: 15px; }
    .card { border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(150deg, rgba(43, 32, 61, .96), rgba(27, 20, 39, .98)); box-shadow: 0 16px 50px rgba(0, 0, 0, .12); }
    .muted { color: var(--muted); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 11px; border: 0; border-radius: 11px; cursor: pointer; min-height: 47px; padding: 0 21px; font-size: 13px; font-weight: 750; transition: transform .16s, background .16s, box-shadow .16s; }
    .btn-primary { color: #fff; background: linear-gradient(135deg, #7C3AED, #A78BFA); box-shadow: 0 9px 22px rgba(124, 58, 237, .25); }
    .btn-primary:hover { transform: translateY(-1px); background: linear-gradient(135deg, #8B5CF6, #B49BFF); }
    .btn-outline { color: #D5C8E8; border: 1px solid rgba(196, 181, 253, .22); background: rgba(255, 255, 255, .025); }
    .btn-outline:hover { background: rgba(255, 255, 255, .07); }
    .btn:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #C4B5FD; outline-offset: 3px; }
    .section-heading { font-size: 17px; letter-spacing: -.025em; font-weight: 700; margin: 0 0 6px; }
    .section-copy { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
    .footer { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 46px; display: flex; justify-content: space-between; gap: 12px; color: #8F82A5; font-size: 12px; }
    @media (max-width: 740px) {
      .shell { padding: 20px 16px 32px; }
      .topbar { flex-direction: column; align-items: stretch; }
      .topbar-right { justify-content: space-between; gap: 10px; }
      .nav a { padding: 9px 10px; }
      .main { padding-top: 33px; }
      .footer { flex-direction: column; }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/api/cnab/" aria-label="Ir para importação">
        <span class="brand-icon" aria-hidden="true">C<span style="color:#D8B4FE">.</span></span>
        <span><span class="brand-name">CNAB Studio</span><span class="brand-caption">Processamento de transações</span></span>
      </a>
      <div class="topbar-right">
        <span class="status"><span class="status-dot"></span> Ambiente de demonstração</span>
        <nav class="nav" aria-label="Menu principal">
          <a href="/api/cnab/" {% block upload_active %}{% endblock %}>Importar</a>
          <a href="/api/cnab/transactions/" {% block transactions_active %}{% endblock %}>Resultados</a>
        </nav>
      </div>
    </header>
    <main class="main">{% block content %}{% endblock %}</main>
    <footer class="footer">
      <span>CNAB Studio · Aplicação desenvolvida com Django e PostgreSQL</span>
      <span>Interface de demonstração · Dados para testes</span>
    </footer>
  </div>
</body>
</html>
